{% extends "base.html" %}

{% block title %}New Post — Simple Blog{% endblock %}

{% block content %}

  <!-- Page heading -->
  <div class="page-heading">
    <h1>New Post</h1>
    <p>Fill in the fields below and hit Publish.</p>
  </div>

  <!-- Create form -->
  <div class="form-card">
    <form action="{{ url_for('create') }}" method="POST">

      <!-- Post title -->
      <div class="form-group">
        <label for="title">Post Title</label>
        <input
          type="text"
          id="title"
          name="title"
          placeholder="Enter a compelling title…"
          required
          autofocus
        />
      </div>

      <!-- Post content -->
      <div class="form-group">
        <label for="content">Content</label>
        <textarea
          id="content"
          name="content"
          placeholder="Write your post here…"
          required
        ></textarea>
      </div>

      <!-- Form actions -->
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Publish Post</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
      </div>

    </form>
  </div>

{% endblock %}
