<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Simple Blog{% endblock %}</title>

  <!-- Google Fonts: editorial pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    /* ── Design tokens ──────────────────────────────────── */
    :root {
      --bg:        #0d0d0d;
      --surface:   #161616;
      --border:    #2a2a2a;
      --accent:    #c8a96e;   /* warm gold */
      --accent2:   #e8c88a;
      --text:      #e8e3db;
      --muted:     #7a7570;
      --danger:    #c0392b;
      --radius:    4px;
      --max-w:     780px;
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Decorative top stripe ──────────────────────────── */
    body::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    }

    /* ── Header / Nav ───────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .brand-sub {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    nav { display: flex; gap: 0.5rem; align-items: center; }

    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      border: 1px solid transparent;
      border-radius: var(--radius);
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--text); border-color: var(--border); }

    .btn-nav {
      background: var(--accent);
      color: #0d0d0d !important;
      border-color: var(--accent) !important;
      font-weight: 500;
    }
    .btn-nav:hover { background: var(--accent2); border-color: var(--accent2) !important; }

    /* ── Main content ───────────────────────────────────── */
    main {
      flex: 1;
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    /* ── Page heading ───────────────────────────────────── */
    .page-heading {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .page-heading h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .page-heading p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    /* ── Blog post card ─────────────────────────────────── */
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem 2rem;
      margin-bottom: 1.2rem;
      position: relative;
      transition: border-color 0.2s;
    }
    .post-card:hover { border-color: #3a3a3a; }

    .post-number {
      position: absolute;
      top: 1.6rem;
      right: 1.8rem;
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--border);
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .post-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.75rem;
      line-height: 1.3;
      padding-right: 3rem;
    }
    .post-content {
      color: #b0aa9f;
      font-size: 0.95rem;
      line-height: 1.75;
      margin-bottom: 1.4rem;
    }

    .post-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      display: inline-block;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-edit {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-edit:hover { background: var(--accent); color: #0d0d0d; }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-delete:hover { background: var(--danger); color: #fff; }

    .btn-primary {
      background: var(--accent);
      color: #0d0d0d;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-secondary:hover { color: var(--text); border-color: #444; }

    /* ── Empty state ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    /* ── Forms ──────────────────────────────────────────── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
    }

    .form-group { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    textarea:focus { border-color: var(--accent); }

    textarea { resize: vertical; min-height: 160px; line-height: 1.7; }

    .form-actions {
      display: flex;
      gap: 0.7rem;
      margin-top: 2rem;
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

  <!-- ── Navigation Header ── -->
  <header>
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-name">Simple Blog</span>
      <span class="brand-sub">Flask CRUD · Experiment 5</span>
    </a>
    <nav>
      <a class="nav-link" href="{{ url_for('index') }}">Home</a>
      <a class="nav-link btn-nav" href="{{ url_for('create') }}">+ New Post</a>
    </nav>
  </header>

  <!-- ── Page Content ── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ── -->
  <footer>
    Built with <span>Flask</span> · Experiment 5 · April 2026
  </footer>

</body>
</html>
