{% extends "base.html" %}

{% block title %}Edit Post — Simple Blog{% endblock %}

{% block content %}

  <!-- Page heading -->
  <div class="page-heading">
    <h1>Edit Post</h1>
    <p>Update the fields below and save your changes.</p>
  </div>

  <!-- Edit form – pre-filled with current post data via Jinja2 -->
  <div class="form-card">
    <form action="{{ url_for('edit', post_id=post.id) }}" method="POST">

      <!-- Post title (pre-filled) -->
      <div class="form-group">
        <label for="title">Post Title</label>
        <input
          type="text"
          id="title"
          name="title"
          value="{{ post.title }}"
          required
          autofocus
        />
      </div>

      <!-- Post content (pre-filled) -->
      <div class="form-group">
        <label for="content">Content</label>
        <textarea
          id="content"
          name="content"
          required
        >{{ post.content }}</textarea>
      </div>

      <!-- Form actions -->
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save Changes</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
      </div>

    </form>
  </div>

{% endblock %}
