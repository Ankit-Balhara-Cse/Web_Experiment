{% extends "base.html" %}
{% block title %}Edit Event{% endblock %}

{% block content %}
<section class="form-section">
    <h2 style="margin-bottom: 20px;">Edit Event</h2>
    <form action="{{ url_for('admin_edit', event_id=event.id) }}" method="POST">
        <div class="form-group">
            <label>Event Name</label>
            <input type="text" name="name" value="{{ event.name }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" value="{{ event.date }}" required>
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="time" name="time" value="{{ event.time }}" required>
            </div>
        </div>
        <div class="form-group">
            <label>Venue</label>
            <input type="text" name="venue" value="{{ event.venue }}" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category">
                {% for cat in ['Technology', 'Music', 'Cultural', 'Sports', 'Other'] %}
                <option {% if cat == event.category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3">{{ event.description }}</textarea>
        </div>
        <div class="form-group">
            <label>Image URL</label>
            <input type="text" name="image" value="{{ event.image }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin') }}" class="btn btn-outline">Cancel</a>
    </form>
</section>
{% endblock %}
