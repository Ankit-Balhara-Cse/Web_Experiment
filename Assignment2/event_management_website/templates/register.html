{% extends "base.html" %}
{% block title %}Register for Event{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Event Registration</h1>
    <p>Fill in your details to register for an event.</p>
</section>

<section class="form-section">
    <form id="registerForm" action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">
            <span class="error" id="nameError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter 10-digit phone number">
            <span class="error" id="phoneError"></span>
        </div>

        <div class="form-group">
            <label for="event">Select Event</label>
            <select id="event" name="event">
                <option value="">-- Select an Event --</option>
                {% for event in events %}
                <option value="{{ event.id }}">{{ event.name }} ({{ event.date }})</option>
                {% endfor %}
            </select>
            <span class="error" id="eventError"></span>
        </div>

        <div class="form-group">
            <label for="tickets">Number of Tickets</label>
            <input type="number" id="tickets" name="tickets" min="1" max="10" placeholder="How many tickets?">
            <span class="error" id="ticketsError"></span>
        </div>

        <button type="button" class="btn btn-primary" onclick="validateForm()">Register</button>
    </form>
</section>
{% endblock %}
