<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Contact Manager{% endblock %}</title>

  <!-- Distinctive font pairing: Syne (display) + Epilogue (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Epilogue:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Design tokens ──────────────────────────────────── */
    :root {
      --bg:        #f0f4f8;
      --surface:   #ffffff;
      --border:    #d8e0ea;
      --accent:    #0f766e;   /* teal-700 */
      --accent-lt: #ccfbf1;   /* teal-100 */
      --accent-dk: #0d5c56;
      --text:      #1e293b;
      --muted:     #64748b;
      --danger:    #dc2626;
      --danger-lt: #fee2e2;
      --warn:      #d97706;
      --radius:    8px;
      --shadow:    0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Epilogue', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top accent bar ─────────────────────────────────── */
    body::before {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, #0f766e, #14b8a6, #0f766e);
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      box-shadow: 0 1px 0 var(--border);
    }

    .brand {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .brand-name span { color: var(--accent); }

    nav { display: flex; gap: 0.5rem; align-items: center; }

    .nav-link {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 0.45rem 1rem;
      border-radius: var(--radius);
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .nav-link:hover { background: var(--bg); color: var(--text); }
    .nav-link.active { background: var(--accent-lt); color: var(--accent); }

    .btn-add-nav {
      background: var(--accent) !important;
      color: #fff !important;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .btn-add-nav:hover { background: var(--accent-dk) !important; }

    /* ── Main ───────────────────────────────────────────── */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* ── Page header block ──────────────────────────────── */
    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.2;
    }
    .page-header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

    /* ── Search bar ─────────────────────────────────────── */
    .search-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .search-bar input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Epilogue', sans-serif;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
    }
    .search-bar input::placeholder { color: var(--muted); }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'Epilogue', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dk); box-shadow: 0 2px 8px rgba(15,118,110,.3); }

    .btn-secondary { background: var(--surface); color: var(--muted); border-color: var(--border); }
    .btn-secondary:hover { color: var(--text); border-color: #aab; }

    .btn-edit { background: var(--accent-lt); color: var(--accent); border-color: transparent; }
    .btn-edit:hover { background: #a7f3d0; }

    .btn-danger { background: var(--danger-lt); color: var(--danger); border-color: transparent; }
    .btn-danger:hover { background: #fca5a5; }

    .btn-search { background: var(--accent); color: #fff; padding: 0.7rem 1.2rem; font-size: 0.85rem; }
    .btn-search:hover { background: var(--accent-dk); }

    .btn-clear { background: transparent; color: var(--muted); border-color: var(--border); font-size: 0.8rem; padding: 0.7rem 0.9rem; }
    .btn-clear:hover { color: var(--danger); border-color: var(--danger); }

    /* ── Contact table ──────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 0.75rem 1.2rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    td {
      padding: 0.9rem 1.2rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .contact-name {
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent-lt);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      flex-shrink: 0;
    }
    .contact-phone, .contact-email { color: var(--muted); font-size: 0.85rem; }
    .action-cell { display: flex; gap: 0.4rem; justify-content: flex-end; }

    /* ── Stats bar ──────────────────────────────────────── */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .stats-bar strong { color: var(--text); }

    /* ── Empty state ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty-state h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    /* ── Form card ──────────────────────────────────────── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 2.5rem;
      max-width: 540px;
    }

    .form-group { margin-bottom: 1.3rem; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Epilogue', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
      background: #fff;
    }
    .form-actions { display: flex; gap: 0.6rem; margin-top: 1.8rem; }

    /* ── Alert ──────────────────────────────────────────── */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      border: 1px solid transparent;
    }
    .alert-error { background: var(--danger-lt); color: var(--danger); border-color: #fca5a5; }

    /* ── Search highlight ───────────────────────────────── */
    .highlight { background: #fef08a; border-radius: 2px; padding: 0 2px; }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.2rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    footer span { color: var(--accent); font-weight: 500; }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 640px) {
      th:nth-child(3), td:nth-child(3) { display: none; }
      .form-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- ── Header / Nav ── -->
  <header>
    <a class="brand" href="{{ url_for('index') }}">
      <div class="brand-icon">📇</div>
      <span class="brand-name">Contact<span>Manager</span></span>
    </a>
    <nav>
      <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
         href="{{ url_for('index') }}">🏠 Home</a>
      <a class="nav-link btn-add-nav"
         href="{{ url_for('add_contact') }}">＋ Add Contact</a>
    </nav>
  </header>

  <!-- ── Content ── -->
  <main>{% block content %}{% endblock %}</main>

  <!-- ── Footer ── -->
  <footer>
    <span>Contact Management System</span> · Experiment 6 · Flask CRUD · April 2026
  </footer>

</body>
</html>
