{% extends "base.html" %}

{% block title %}Add Contact — Contact Manager{% endblock %}

{% block content %}

  <!-- Page heading -->
  <div class="page-header">
    <h1>＋ Add New Contact</h1>
    <p>Fill in all three fields to save a contact.</p>
  </div>

  <div class="form-card">

    <!-- Validation error alert -->
    {% if error %}
      <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <!-- Add contact form: POST to /add -->
    <form action="{{ url_for('add_contact') }}" method="POST">

      <!-- Name field -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="e.g. Jane Doe"
          value="{{ request.form.get('name', '') }}"
          required
          autofocus
        />
      </div>

      <!-- Phone field -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="e.g. 9876543210"
          value="{{ request.form.get('phone', '') }}"
          required
        />
      </div>

      <!-- Email field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="e.g. jane@example.com"
          value="{{ request.form.get('email', '') }}"
          required
        />
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">💾 Save Contact</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
      </div>

    </form>
  </div>

{% endblock %}
