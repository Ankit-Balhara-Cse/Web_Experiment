{% extends "base.html" %}

{% block title %}Edit Contact — Contact Manager{% endblock %}

{% block content %}

  <!-- Page heading -->
  <div class="page-header">
    <h1>✎ Edit Contact</h1>
    <p>Update the details for <strong>{{ contact.name }}</strong>.</p>
  </div>

  <div class="form-card">

    <!-- Validation error alert -->
    {% if error %}
      <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <!-- Edit form: POST to /edit/<id>  Pre-filled via Jinja value= attributes -->
    <form action="{{ url_for('edit_contact', contact_id=contact.id) }}" method="POST">

      <!-- Name (pre-filled) -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          value="{{ request.form.get('name', contact.name) }}"
          required
          autofocus
        />
      </div>

      <!-- Phone (pre-filled) -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          value="{{ request.form.get('phone', contact.phone) }}"
          required
        />
      </div>

      <!-- Email (pre-filled) -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ request.form.get('email', contact.email) }}"
          required
        />
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">💾 Save Changes</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
      </div>

    </form>
  </div>

{% endblock %}
